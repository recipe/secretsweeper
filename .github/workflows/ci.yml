name: Build and Test

on:
  push:
    branches:
      - main
    tags:
      - "[0-9]*"
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Ruff format
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.13.3"
          args: "format --check ."

      - name: Ruff check
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.13.3"
          args: "check ."

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          python-version: "3.14"

      - name: Type check
        run: uv sync --no-install-project && uv run --no-sync ty check

      # Every other job depends on this one, so a release tag that does not name the
      # version in pyproject.toml fails here before anything is built or published.
      # Compared as PEP 440 versions: the tag 0.0.1-alpha.8 matches 0.0.1a8.
      - name: Check tag matches project version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          uv run --no-project --with packaging python - <<'PY'
          import os
          import tomllib

          from packaging.version import Version

          tag = os.environ["TAG"]
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          if Version(tag) != Version(version):
              raise SystemExit(f"tag {tag} does not match pyproject.toml version {version}")
          print(f"tag {tag} matches pyproject.toml version {version}")
          PY

  zig-test:
    name: Zig tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          python-version: "3.14"

      # Runs the tests in src/ (aho.zig and the C ABI exports in export.zig).
      # The pinned ziglang version must match build-system.requires in pyproject.toml.
      - name: Run zig build test
        run: uv run --no-project --with ziglang==0.16.0 python -m ziglang build test

  build:
    name: Build wheels on ${{ matrix.os }}
    needs: [lint, zig-test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-14
          - windows-latest
          - windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      # The native aarch64-windows zig crashes on any compilation (ziglang/zig#16665),
      # so run the x86_64 zig under Windows x64 emulation; the wheel's DLL is still
      # cross-compiled for aarch64.
      - name: Install x86_64 Zig for Windows ARM64
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $expected = "68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e"
          Invoke-WebRequest -Uri https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip -OutFile $env:RUNNER_TEMP\zig.zip
          $actual = (Get-FileHash "$env:RUNNER_TEMP\zig.zip" -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "zig.zip SHA-256 mismatch: expected $expected, got $actual" }
          Expand-Archive $env:RUNNER_TEMP\zig.zip -DestinationPath $env:RUNNER_TEMP\zig
          "SECRET_SWEEPER_ZIG=$env:RUNNER_TEMP\zig\zig-x86_64-windows-0.16.0\zig.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build wheels
        uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
        env:
          # The hatch build hook passes this to zig as the target's minimum macOS
          # version; without it the dylib would require the runner's own OS version.
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=11.0
          CIBW_BUILD: "cp311-* cp312-* cp313-* cp314-* cp314t-* cp315-* cp315t-*"
          CIBW_BUILD_FRONTEND: pip
          CIBW_BUILD_VERBOSITY: 0
          CIBW_TEST_COMMAND: "pip install pytest hatchling==1.28.0 && pytest {project}/tests"
          CIBW_TEST_ENVIRONMENT: SECRET_SWEEPER_REQUIRE_NATIVE=1
          CIBW_SKIP: "*-win32"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  build-sdist:
    name: Build sdist
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          python-version: "3.14"

      - name: Build sdist package
        run: uv build --sdist && ls -al dist

      - name: Upload sdist package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: ./dist/*.tar.gz
          if-no-files-found: error

  upload:
    name: Upload to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, build-sdist]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/secretsweeper/
    permissions:
      # Required for PyPI Trusted Publishing (OIDC).
      id-token: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Display structure of downloaded files
        run: ls -lh dist

      # Pinned by tag, not SHA: this is a Docker action that pulls its image from
      # GHCR using the ref as the image tag, and pypa only publishes tag-named
      # images (pinning the SHA fails with "manifest unknown").
      - uses: pypa/gh-action-pypi-publish@v1.14.0
        with:
          skip-existing: true
