name: Build and Test

on:
  push:
    branches:
      - main
    tags:
      - "[0-9]*"
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ruff format
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.13.3"
          args: "format --check ."

      - name: Ruff check
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.13.3"
          args: "check ."

  build:
    name: Build wheels on ${{ matrix.os }}
    needs: [lint]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-14
          - windows-latest
          - windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The native aarch64-windows zig crashes on any compilation (ziglang/zig#16665),
      # so run the x86_64 zig under Windows x64 emulation; the wheel's DLL is still
      # cross-compiled for aarch64.
      - name: Install x86_64 Zig for Windows ARM64
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip -OutFile $env:RUNNER_TEMP\zig.zip
          Expand-Archive $env:RUNNER_TEMP\zig.zip -DestinationPath $env:RUNNER_TEMP\zig
          "SECRETSWEEPER_ZIG=$env:RUNNER_TEMP\zig\zig-x86_64-windows-0.16.0\zig.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3.1
        env:
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=${{ runner.arch == 'X64' && '15.7' || '14.8' }}
          CIBW_BUILD_FRONTEND: pip
          CIBW_BUILD_VERBOSITY: 0
          CIBW_TEST_COMMAND: "pip install pytest && pytest {project}/tests"
          CIBW_SKIP: "cp3??t-* *-win32"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  build-sdist:
    name: Build sdist
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.22"

      - name: Build sdist package
        run: uv build --sdist && ls -al dist

      - name: Upload sdist package
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: ./dist/*.tar.gz
          if-no-files-found: error

  upload:
    name: Upload to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, build-sdist]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Display structure of downloaded files
        run: ls -lh dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          skip-existing: true
          user: ${{ secrets.PYPI_USERNAME }}
          password: ${{ secrets.PYPI_PASSWORD }}
