[project]
name = "secretsweeper"
version = "0.0.1a7"
description = "Fast, in-memory secret-sanitizing CPython module written in Zig, designed for speed."
authors = [{ name = "Vitaliy Demidov", email = "notifications.recipient@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/recipe/secretsweeper"
Source = "https://github.com/recipe/secretsweeper"
Changelog = "https://github.com/recipe/secretsweeper/blob/main/CHANGELOG.md"
Issues = "https://github.com/recipe/secretsweeper/issues"

[build-system]
requires = ["hatchling==1.28.0", "ziglang==0.16.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["secretsweeper"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
    "secretsweeper",
    "src",
    "build.zig",
    "hatch_build.py",
    "tests",
]
exclude = [
    "secretsweeper/*.so",
    "secretsweeper/*.dylib",
    "secretsweeper/*.dll",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "UP", "I001", "I002"]

[dependency-groups]
dev = [
    "gevent (>=25.4.1,<26.0.0)",
    "hatchling==1.28.0",
    "ziglang==0.16.0",
    "pre-commit (>=4.6.0,<5.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "ruff (>=0.13.3,<0.14.0)",
    "ty (==0.0.56)"
]
benchmark = [
    "acora (>=2.5,<3.0)",
    "ahocorapy (>=1.0.2,<2.0.0)",
    "ahocorasick-rs (>=0.22.0,<0.23.0)",
    "pyahocorasick (>=2.1.0,<3.0.0)",
]
