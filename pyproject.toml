[project]
name = "secretsweeper"
version = "0.0.1a4"
description = "Fast, in-memory secret-sanitizing CPython module written in Zig, designed for speed."
authors = [{ name = "Vitaliy Demidov", email = "notifications.recipient@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

[build-system]
requires = ["hatchling==1.28.0", "ziglang==0.16.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["secretsweeper"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
    "secretsweeper",
    "src",
    "build.zig",
    "hatch_build.py",
    "tests",
]
exclude = [
    "secretsweeper/*.so",
    "secretsweeper/*.dylib",
    "secretsweeper/*.dll",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "UP", "I001", "I002"]

[dependency-groups]
dev = [
    "hatchling==1.28.0",
    "ziglang==0.16.0",
    "pre-commit (>=4.6.0,<5.0.0)",
    "pytest (>=8.4.2,<9.0.0)",
    "ruff (>=0.13.3,<0.14.0)",
    "ty (==0.0.56)"
]
